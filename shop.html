  <style>
    :root {
      --primary: #2563eb;
      --accent: #16a34a;
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --coupang: #ff5722;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px 60px; }

    /* ── 헤더 ── */
    header {
      text-align: center;
      padding: 28px 16px 22px;
      background: linear-gradient(135deg, #2563eb 0%, #16a34a 100%);
      color: #fff;
      border-radius: 0 0 24px 24px;
      margin-bottom: 20px;
    }
    header .logo {
      width: 64px; height: 64px;
      border-radius: 16px;
      margin: 0 auto 12px;
      display: block;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);

    header h1 { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    header p { font-size: 13.5px; opacity: 0.92; }
    .back-link {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 14px;
      background: rgba(255,255,255,0.18);
      color: #fff; text-decoration: none;
      padding: 8px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 600;
      backdrop-filter: blur(4px);
    }
    .back-link:active { transform: scale(0.97); }

    /* ── 카테고리 ── */
    .cat { margin-bottom: 28px; }
    .cat-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 17px; font-weight: 800;
      margin: 0 4px 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }
    .cat-title .emoji { font-size: 20px; }
    .cat-title .count {
      margin-left: auto;
      font-size: 12px; font-weight: 600;
      color: var(--muted);
      background: #eef2ff;
      padding: 2px 9px; border-radius: 999px;
    }

    /* ── 상품 카드 ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .product {
      display: flex; flex-direction: column;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .product:active { transform: scale(0.98); }
    @media (hover: hover) {
      .product:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.08); transform: translateY(-2px); }
    }
    .product .thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, #eef2ff, #e0f2f1);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .product .thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .product .thumb .ph { font-size: 46px; opacity: 0.55; }

    /* 쿠팡 배너 이미지: 상품 사진 부분만 보이도록 크롭 (로고/버튼 숨김) */
    .product.has-img .thumb { background: #fff; }
    .product.has-img .thumb img {
      object-fit: cover;
      object-position: center 30%;
    }
    .product .num {
      position: absolute; top: 8px; left: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 12px; font-weight: 800;
      min-width: 24px; height: 24px;
      border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 7px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18);
    }
    .product .body {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 10px 11px 12px;
    }
    .product .name {
      font-size: 13px; font-weight: 600;
      line-height: 1.35;
      margin-bottom: 10px;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .product .buy {
      margin-top: auto;
      text-align: center;
      background: var(--coupang);
      color: #fff;
      font-size: 12.5px; font-weight: 700;
      padding: 8px 6px;
      border-radius: 9px;
    }

    /* ── 면책 고지 ── */
    .disclosure {
      margin-top: 8px;
      background: #fff8e1;
      border: 1px solid #ffe0a3;
      color: #8a6d3b;
      font-size: 12px;
      line-height: 1.6;
      padding: 13px 15px;
      border-radius: 12px;
      text-align: center;
    }

    const PLACEHOLDER = { "🍺": "🍺", "🍷": "🍷", "🍋": "🍋", "⭐": "🍾", "🤰": "🍇" };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      let n = 0;
      const html = SHOP.map((cat) => {
        const cards = cat.items.map((p) => {
          n += 1;
          const thumb = p.img
            ? `<img src="${escapeHtml(p.img)}" alt="${escapeHtml(p.name)}" loading="lazy" />`
            : `<span class="ph">${PLACEHOLDER[cat.emoji] || "🥤"}</span>`;
          return `
            <a class="product${p.img ? " has-img" : ""}" href="${escapeHtml(p.url)}" target="_blank" rel="noopener sponsored">
              <div class="thumb">
                <span class="num">${n}</span>
                ${thumb}
              </div>
              <div class="body">
                <div class="name">${escapeHtml(p.name)}</div>
                <div class="buy">쿠팡에서 구매 →</div>
              </div>
            </a>`;
        }).join("");
        return `
          <section class="cat">
            <div class="cat-title">
              <span class="emoji">${cat.emoji}</span>
              <span>${escapeHtml(cat.title)}</span>
              <span class="count">${cat.items.length}개</span>
            </div>
            <div class="grid">${cards}</div>
          </section>`;
      }).join("");
      document.getElementById("shop-list").innerHTML = html;
    }

    render();
