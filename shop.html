          { name: "반나멘 유기농 리즐링 화이트 750ml", url: "https://link.coupang.com/a/eML9CWiAFw", img: "https://img4a.coupangcdn.com/image/affiliate/banner/a256e4ad3648a0614c015f7eb37659e3@2x.jpg" },
          { name: "반나멘 유기농 리즐링 화이트 750ml 2개", url: "https://link.coupang.com/a/eMMaIBfkkK", img: "https://img2c.coupangcdn.com/image/affiliate/banner/d8615dcfa93780f6f9c7625270617f18@2x.jpg" },

          { name: "쁘아뽐 스파클링 화이트 750ml 2개", url: "https://link.coupang.com/a/eMMf1nXI4a", img: "https://image7.coupangcdn.com/image/affiliate/banner/d80036d13d8b80d765500a0ab23f4da8@2x.jpg" },

          { name: "제주 한라봉 뱅쇼 선물세트 무알콜 무설탕 300ml", url: "https://link.coupang.com/a/eMMo1aIRNs", img: "https://img4c.coupangcdn.com/image/affiliate/banner/cff9de355f71da01c4079e0c01104e24@2x.jpg" },
        ],
      },
    ];

    const PLACEHOLDER = { "🍺": "🍺", "🍷": "🍷", "🍋": "🍋", "⭐": "🍾", "🤰": "🍇", "🥃": "🥃" };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function render() {
      let n = 0;
      const html = SHOP.map((cat) => {
        const cards = cat.items.map((p) => {
          n += 1;
          const thumb = p.img
            ? `<img src="${escapeHtml(p.img)}" alt="" loading="lazy" decoding="async" />`
            : `<span class="ph">${PLACEHOLDER[cat.emoji] || "🥤"}</span>`;
          const price = p.price ? `<div class="price">${escapeHtml(p.price)}</div>` : "";
          const label = `${n}번. ${p.name}${p.price ? ", " + p.price : ""}. 쿠팡에서 구매하기`;
          return `
            <a class="product${p.img ? " has-img" : ""}" href="${escapeHtml(p.url)}" target="_blank" rel="noopener sponsored" aria-label="${escapeHtml(label)}">
              <div class="thumb">
                <span class="num">${n}</span>
                ${thumb}
              </div>
              <div class="body">
                <div class="name">${escapeHtml(p.name)}</div>
                ${price}
                <div class="buy">구매하기 →</div>
              </div>
            </a>`;
        }).join("");
        const grad = cat.grad
          ? `background: linear-gradient(135deg, ${cat.grad[0]} 0%, ${cat.grad[1]} 100%);`
          : "";
        return `
          <section class="cat">
            <div class="cat-title" style="${grad}">
              <span class="emoji">${cat.emoji}</span>
              <span>${escapeHtml(cat.title)}</span>
              <span class="count">${cat.items.length}개</span>
            </div>
            <div class="grid">${cards}</div>
          </section>`;
      }).join("");
      const list = document.getElementById("shop-list");
      list.innerHTML = html;
      if (!list.dataset.clickBound) {
        list.dataset.clickBound = "1";
        const onBuyClick = (event) => {
          const link = event.target.closest("a.product");
          if (!link) return;
          const name = link.querySelector(".name");
          if (window.trackCoupangClick) trackCoupangClick(name ? name.textContent : "");
        };
        list.addEventListener("click", onBuyClick);
        list.addEventListener("auxclick", onBuyClick);
      }
      list.querySelectorAll(".product img").forEach((img) => {
        img.addEventListener("error", () => {
          const thumb = img.closest(".thumb");
          img.remove();
          if (!thumb || thumb.querySelector(".ph")) return;
          const fallback = document.createElement("span");
          fallback.className = "ph";
          fallback.textContent = "🥤";
          thumb.appendChild(fallback);
        });
      });
    }

    render();
  </script>
