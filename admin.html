<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관리자 — 논알콜 술집 지도</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --primary:#2563eb; --primary-dark:#1d4ed8;
      --accent:#10b981; --danger:#ef4444;
      --bg:#f8fafc; --card:#ffffff;
      --text:#1e293b; --muted:#64748b;
      --border:#e2e8f0; --radius:12px;
      --shadow:0 2px 8px rgba(0,0,0,.08);
      --shadow-lg:0 8px 24px rgba(0,0,0,.12);
    }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }

    /* ── 로그인 ── */
    #login-wrap {
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
    }
    .login-box {
      background:var(--card); border-radius:16px; padding:40px 36px;
      box-shadow:var(--shadow-lg); width:100%; max-width:360px; text-align:center;
    }
    .login-box .logo { font-size:40px; margin-bottom:12px; }
    .login-box h2 { font-size:20px; font-weight:700; margin-bottom:8px; }
    .login-box p { font-size:13px; color:var(--muted); margin-bottom:28px; }
    .login-box input {
      width:100%; padding:11px 14px; border:1px solid var(--border);
      border-radius:8px; font-size:14px; outline:none; margin-bottom:10px;
      transition:border-color .15s;
    }
    .login-box input:focus { border-color:var(--primary); }
    .login-box .btn-submit {
      width:100%; padding:12px; background:var(--primary); color:white;
      border:none; border-radius:8px; font-size:14px; font-weight:600;
      cursor:pointer; transition:background .15s; margin-top:4px;
    }
    .login-box .btn-submit:hover { background:var(--primary-dark); }
    #login-error { color:var(--danger); font-size:13px; margin-top:10px; min-height:18px; }
    .back-link { display:inline-block; margin-top:20px; font-size:13px; color:var(--muted); text-decoration:none; }
    .back-link:hover { color:var(--primary); }

    /* ── 관리자 대시보드 ── */
    #admin-wrap { display:none; }
    #admin-header {
      position:sticky; top:0; z-index:10; background:var(--card);
      border-bottom:1px solid var(--border); padding:0 24px;
      height:56px; display:flex; align-items:center; gap:12px;
      box-shadow:var(--shadow);
    }
    #admin-header h1 { font-size:17px; font-weight:700; }
    #admin-header .spacer { flex:1; }
    #admin-header .count { font-size:13px; color:var(--muted); }
    #admin-header a { font-size:13px; color:var(--muted); text-decoration:none; padding:6px 10px; border:1px solid var(--border); border-radius:8px; }
    #admin-header a:hover { background:var(--bg); }
    #btn-logout {
      padding:6px 12px; border:1px solid var(--border); border-radius:8px;
      background:var(--bg); font-size:13px; cursor:pointer; color:var(--text);
    }
    #btn-logout:hover { background:var(--border); }

    #admin-main { padding:24px; overflow-x:auto; }
    #loading { text-align:center; padding:60px; color:var(--muted); }

    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); min-width:900px; }
    thead { background:#f1f5f9; }
    th { padding:12px 14px; text-align:left; font-size:12px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap; }
    td { padding:12px 14px; font-size:13px; border-bottom:1px solid var(--border); vertical-align:top; }
    tr:last-child td { border-bottom:none; }
    tr:hover td { background:#f8fafc; }
    .td-num { color:var(--muted); font-size:12px; width:36px; }
    .td-name { font-weight:600; min-width:100px; }
    .td-address { color:var(--muted); max-width:180px; line-height:1.4; }
    .td-brands { min-width:160px; }
    .td-desc { max-width:160px; color:var(--muted); line-height:1.4; }
    .td-empty { text-align:center; padding:48px; color:var(--muted); }
    .btag {
      display:inline-block; background:#ecfdf5; color:#065f46;
      border:1px solid #a7f3d0; border-radius:20px; padding:2px 7px;
      font-size:11px; margin:2px 2px 2px 0;
    }
    .btn-del {
      padding:4px 10px; background:white; color:var(--danger);
      border:1px solid var(--danger); border-radius:6px; font-size:12px;
      cursor:pointer; transition:all .15s; white-space:nowrap;
    }
    .btn-fix-coord {
      margin-top:4px; padding:3px 8px; background:#fef3c7; color:#92400e;
      border:1px solid #fcd34d; border-radius:5px; font-size:11px;
      cursor:pointer; white-space:nowrap;
    }
    .btn-fix-coord:hover { background:#fde68a; }
    .btn-del:hover { background:var(--danger); color:white; }

    /* ── 탭 ── */
    .tabs { display:flex; gap:8px; margin-bottom:16px; }
    .tab {
      padding:8px 16px; border:1px solid var(--border); border-radius:8px;
      background:var(--card); font-size:13px; font-weight:600; cursor:pointer;
      color:var(--muted); transition:all .15s; display:flex; align-items:center; gap:6px;
    }
    .tab:hover { border-color:var(--primary); color:var(--primary); }
    .tab.active { background:var(--primary); border-color:var(--primary); color:white; }
    .tab .badge {
      background:var(--danger); color:white; border-radius:10px;
      padding:1px 7px; font-size:11px; font-weight:700;
    }
    .tab.active .badge { background:white; color:var(--danger); }

    .btn-approve {
      padding:4px 10px; background:var(--accent); color:white;
      border:none; border-radius:6px; font-size:12px;
      cursor:pointer; transition:opacity .15s; white-space:nowrap; margin-right:4px;
    }
    .btn-approve:hover { opacity:.85; }
  </style>
</head>
<body>

<!-- ── 접근 안내 ── -->
<div id="login-wrap">
  <div class="login-box">
    <div class="logo">🔒</div>
    <h2 id="gate-title">권한 확인 중...</h2>
    <p id="gate-msg">잠시만 기다려 주세요.</p>
    <div id="login-error"></div>
    <a href="index.html" class="back-link">← 지도로 돌아가기</a>
  </div>
</div>

<!-- ── 관리자 대시보드 ── -->
<div id="admin-wrap">
  <header id="admin-header">
    <h1><a href="index.html" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:8px"><span style="background:#1a1a2e;color:#fff;font-size:13px;font-weight:900;padding:2px 7px;border-radius:6px;letter-spacing:-0.5px">NON</span>논알콜맵 Admin</a></h1>
    <div class="spacer"></div>
    <span class="count" id="place-count"></span>
    <a href="index.html">지도로 돌아가기</a>
    <button id="btn-logout">로그아웃</button>
  </header>
  <main id="admin-main">
    <div class="tabs">
      <button class="tab active" id="tab-places">등록된 가게</button>
      <button class="tab" id="tab-reports">제보 대기 <span class="badge" id="report-badge" style="display:none">0</span></button>
    </div>

    <div id="loading">데이터를 불러오는 중...</div>

    <section id="section-places">
      <table id="places-table" style="display:none">
        <thead>
          <tr>
            <th>#</th>
            <th>가게명</th>
            <th>주소</th>
            <th>논알콜 종류</th>
            <th>설명</th>
            <th>네이버맵</th>
            <th>좌표</th>
            <th>추가한 사람</th>
            <th>등록일</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="places-tbody"></tbody>
      </table>
    </section>

    <section id="section-reports" style="display:none">
      <table id="reports-table" style="display:none">
        <thead>
          <tr>
            <th>#</th>
            <th>가게명</th>
            <th>주소</th>
            <th>네이버맵</th>
            <th>논알콜 종류</th>
            <th>한마디</th>
            <th>좌표</th>
            <th>제보자</th>
            <th>제보일</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody id="reports-tbody"></tbody>
      </table>
    </section>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase-config.js"></script>
<script>
  // 카카오맵 SDK (지오코딩용)
  (function() {
    const s = document.createElement("script");
    s.src = "https://dapi.kakao.com/v2/maps/sdk.js?appkey=" + KAKAO_MAP_KEY + "&libraries=services&autoload=false";
    document.head.appendChild(s);
  })();
</script>
<script>
  let db;
  let adminStarted = false;

  // Firebase 초기화
  try { firebase.initializeApp(FIREBASE_CONFIG); } catch (e) {}

  const ADMIN_LIST = (typeof ADMIN_EMAILS !== "undefined" ? ADMIN_EMAILS : [])
    .map((e) => e.toLowerCase());

  function isAdminEmail(email) {
    return !!(email && ADMIN_LIST.includes(email.toLowerCase()));
  }

  function loadExternalUser() {
    try {
      const raw = localStorage.getItem("nonUser");
      return raw ? JSON.parse(raw) : null;
    } catch { return null; }
  }

  function denyAccess() {
    document.getElementById("gate-title").textContent = "접근 권한이 없습니다";
    document.getElementById("gate-msg").innerHTML =
      "관리자 계정으로 <b>지도 페이지에서 먼저 로그인</b>한 뒤 다시 접속해 주세요.<br>(허용된 관리자 계정만 접근 가능합니다.)";
  }

  // 권한 확인: 카카오/네이버(localStorage) → 구글(Firebase Auth) 순으로 검사
  (function checkAccess() {
    const ext = loadExternalUser();
    if (ext && isAdminEmail(ext.email)) { showAdmin(); return; }

    // 구글 로그인 상태 확인 (비동기)
    firebase.auth().onAuthStateChanged((user) => {
      if (adminStarted) return;
      if (user && isAdminEmail(user.email)) {
        showAdmin();
      } else {
        // 외부 사용자도 아니고 구글 관리자도 아님
        if (!(ext && isAdminEmail(ext.email))) denyAccess();
      }
    });

    // Firebase 응답이 늦을 때를 대비해, 외부 사용자가 관리자 아니면 우선 안내
    setTimeout(() => {
      if (!adminStarted && !(ext && isAdminEmail(ext.email)) && !firebase.auth().currentUser) {
        denyAccess();
      }
    }, 1500);
  })();

  document.getElementById("btn-logout").addEventListener("click", () => {
    if (firebase.auth().currentUser) firebase.auth().signOut();
    location.href = "index.html";
  });

  function showAdmin() {
    if (adminStarted) return;
    adminStarted = true;
    document.getElementById("login-wrap").style.display = "none";
    document.getElementById("admin-wrap").style.display = "block";
    db = firebase.firestore();
    loadPlaces();
    loadReports();
    initTabs();
  }

  function initTabs() {
    const tabPlaces = document.getElementById("tab-places");
    const tabReports = document.getElementById("tab-reports");
    tabPlaces.addEventListener("click", () => switchTab("places"));
    tabReports.addEventListener("click", () => switchTab("reports"));
  }

  function switchTab(name) {
    document.getElementById("tab-places").classList.toggle("active", name === "places");
    document.getElementById("tab-reports").classList.toggle("active", name === "reports");
    document.getElementById("section-places").style.display = name === "places" ? "block" : "none";
    document.getElementById("section-reports").style.display = name === "reports" ? "block" : "none";
  }

  function loadPlaces() {
    db.collection("places").orderBy("createdAt", "desc").onSnapshot((snap) => {
      const places = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      document.getElementById("place-count").textContent = `총 ${places.length}개 가게`;
      document.getElementById("loading").style.display = "none";
      document.getElementById("places-table").style.display = places.length ? "table" : "none";
      renderTable(places);
    }, (err) => {
      document.getElementById("loading").textContent = "데이터 로드 실패: " + err.message;
    });
  }

  function renderTable(places) {
    const tbody = document.getElementById("places-tbody");
    if (!places.length) {
      tbody.innerHTML = `<tr><td colspan="10" class="td-empty">등록된 가게가 없습니다.</td></tr>`;
      document.getElementById("places-table").style.display = "table";
      return;
    }
    tbody.innerHTML = places.map((p, i) => {
      const hasCoords = p.lat && p.lng && !(p.lat === 0 && p.lng === 0);
      const coordCell = hasCoords
        ? `<span style="color:#10b981;font-size:11px">✓ ${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span>`
        : `<span style="color:#ef4444;font-size:11px">❌ 좌표 없음</span><br><button class="btn-fix-coord" onclick="fixCoords('${p.id}','${h(p.address)}')">📍 주소로 재설정</button>`;
      return `
      <tr>
        <td class="td-num">${i + 1}</td>
        <td class="td-name">${h(p.name)}</td>
        <td class="td-address">${h(p.address)}</td>
        <td class="td-brands">${(p.brands||[]).map(b=>`<span class="btag">${h(b)}</span>`).join("")}</td>
        <td class="td-desc">${h(p.description||"")}</td>
        <td><a href="https://map.naver.com/p/search/${encodeURIComponent(p.name||'')}" target="_blank" rel="noopener" style="color:#2563eb;font-weight:600;font-size:12px">네이버 맵</a></td>
        <td style="font-size:11px">${coordCell}</td>
        <td>${h(p.addedBy||"익명")}</td>
        <td style="white-space:nowrap">${fmtDate(p.createdAt)}</td>
        <td><button class="btn-del" onclick="del('${p.id}')">삭제</button></td>
      </tr>`;
    }).join("");
  }

  async function fixCoords(id, address) {
    kakao.maps.load(async () => {
      try {
        const geocoder = new kakao.maps.services.Geocoder();
        geocoder.addressSearch(address, async (result, status) => {
          if (status === kakao.maps.services.Status.OK && result.length > 0) {
            const lat = parseFloat(result[0].y);
            const lng = parseFloat(result[0].x);
            await db.collection("places").doc(id).update({ lat, lng });
            alert(`✅ 좌표 재설정 완료!\n위도: ${lat.toFixed(5)}\n경도: ${lng.toFixed(5)}\n\n지도에서 NON 마커가 표시됩니다.`);
          } else {
            const manual = prompt(`주소로 좌표를 찾지 못했습니다.\n가게 주소를 더 자세히 입력해 주세요:\n\n현재 주소: ${address}`);
            if (manual) fixCoords(id, manual);
          }
        });
      } catch(e) { alert("지오코딩 오류: " + e.message); }
    });
  }

  async function del(id) {
    if (!confirm("이 가게를 삭제하시겠습니까?")) return;
    try {
      await db.collection("places").doc(id).delete();
      alert("삭제 완료됐습니다.");
    } catch (e) {
      console.error("삭제 오류:", e);
      alert("삭제 실패: " + e.message + "\n\nFirebase 콘솔 > Firestore > 규칙에서 places 쓰기 권한을 확인해 주세요.");
    }
  }

  // ── 제보 관리 ──
  let reportsCache = [];

  function loadReports() {
    db.collection("reports").where("status", "==", "pending").onSnapshot((snap) => {
      reportsCache = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      reportsCache.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

      const badge = document.getElementById("report-badge");
      badge.textContent = reportsCache.length;
      badge.style.display = reportsCache.length ? "inline-block" : "none";

      renderReports(reportsCache);
    }, (err) => {
      console.error("제보 로드 실패:", err);
    });
  }

  // 네이버맵 셀: 저장된 URL이 있으면 그 링크, 없으면 가게명+주소로 네이버맵 검색 링크 생성
  function naverMapCell(r) {
    const searchUrl = "https://map.naver.com/p/search/" + encodeURIComponent(r.name || "");
    const href = r.naverUrl || searchUrl;
    return `<a href="${h(href)}" target="_blank" rel="noopener" style="color:#2563eb;font-weight:600">네이버 맵</a>`;
  }

  function fmtDate(ts) {
    if (!ts) return "-";
    const d = new Date(ts.seconds * 1000);
    const date = d.toLocaleDateString("ko-KR");
    const time = d.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
    return `${date} ${time}`;
  }

  function renderReports(reports) {
    const table = document.getElementById("reports-table");
    const tbody = document.getElementById("reports-tbody");
    table.style.display = "table";

    if (!reports.length) {
      tbody.innerHTML = `<tr><td colspan="10" class="td-empty">대기 중인 제보가 없습니다.</td></tr>`;
      return;
    }

    tbody.innerHTML = reports.map((r, i) => `
      <tr>
        <td class="td-num">${i + 1}</td>
        <td class="td-name">${h(r.name)}</td>
        <td class="td-address">${h(r.address)}</td>
        <td style="font-size:12px">${naverMapCell(r)}</td>
        <td class="td-brands">${(r.brands||[]).map(b=>`<span class="btag">${h(b)}</span>`).join("")}</td>
        <td class="td-desc">${h(r.comment||"")}</td>
        <td style="font-size:11px;color:${r.lat&&r.lng?'#10b981':'#ef4444'}">
          ${r.lat && r.lng ? `✓ ${r.lat.toFixed(4)},${r.lng.toFixed(4)}` : "❌ 좌표 없음"}
        </td>
        <td>${h(r.reportedBy||"익명")}</td>
        <td style="white-space:nowrap">${fmtDate(r.createdAt)}</td>
        <td style="white-space:nowrap">
          <button class="btn-approve" onclick="approveReport('${r.id}')">✓ 승인</button>
          <button class="btn-del" onclick="rejectReport('${r.id}')">거절</button>
        </td>
      </tr>
    `).join("");
  }

  async function doSaveApproval(r, lat, lng) {
    console.log("승인 저장 시작:", r.name, lat, lng);
    const docRef = await db.collection("places").add({
      name: r.name,
      address: r.address,
      lat: Number(lat),
      lng: Number(lng),
      brands: r.brands || [],
      description: r.comment || "",
      phone: r.phone || "",
      hours: "",
      addedBy: r.reportedBy || "익명",
      source: "report",
      reportId: r.id,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    console.log("places 저장 완료, ID:", docRef.id);
    await db.collection("reports").doc(r.id).update({ status: "approved" });
    console.log("reports 상태 업데이트 완료");
    const mapUrl = "index.html";
    const go = confirm(`✅ '${r.name}' 승인 완료!\n\n저장 ID: ${docRef.id}\n\n지도에서 확인하시겠습니까?`);
    if (go) window.open(mapUrl, "_blank");
  }

  async function approveReport(id) {
    const r = reportsCache.find((x) => x.id === id);
    if (!r) return;
    if (!confirm(`'${r.name}' 가게를 승인하여 지도에 표시하시겠습니까?`)) return;

    try {
      if (r.lat && r.lng) {
        await doSaveApproval(r, r.lat, r.lng);
      } else {
        // lat/lng 없으면 카카오 지오코딩으로 주소 → 좌표 변환
        kakao.maps.load(async () => {
          try {
            const geocoder = new kakao.maps.services.Geocoder();
            geocoder.addressSearch(r.address, async (result, status) => {
              try {
                if (status === kakao.maps.services.Status.OK && result.length > 0) {
                  await doSaveApproval(r, parseFloat(result[0].y), parseFloat(result[0].x));
                } else {
                  if (confirm("⚠️ 주소에서 좌표를 찾지 못했습니다.\n좌표 없이 저장하면 지도에 마커가 표시되지 않습니다.\n계속하시겠습니까?")) {
                    await doSaveApproval(r, 0, 0);
                  }
                }
              } catch(e) { alert("승인 중 오류: " + e.message); }
            });
          } catch(e) { alert("지오코더 오류: " + e.message); }
        });
      }
    } catch (e) {
      console.error("approveReport 오류:", e);
      alert("승인 중 오류가 발생했습니다:\n" + e.message);
    }
  }

  async function rejectReport(id) {
    if (!confirm("이 제보를 거절하시겠습니까?")) return;
    try {
      await db.collection("reports").doc(id).update({ status: "rejected" });
    } catch (e) {
      console.error(e);
      alert("처리 중 오류가 발생했습니다: " + e.message);
    }
  }

  function h(s) {
    if (!s) return "";
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
</script>
